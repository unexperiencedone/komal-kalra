<body class="bg-surface text-on-surface font-body-base antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Subtle Celestial Background Pattern -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(#a45f1e 1px, transparent 1px); background-size: 40px 40px;"></div>
<div class="relative z-10 w-full max-w-md px-6 py-12 md:px-0">
<!-- Logo / Brand -->
<div class="text-center mb-12">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">KOMAL KALRA</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2 uppercase tracking-widest">Portal Access</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-linen-grey rounded-DEFAULT p-8 md:p-10 relative">
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-small text-label-small text-on-surface-variant mb-1 uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline px-3" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="block w-full border-0 border-b border-outline-variant bg-transparent py-3 pl-10 pr-3 text-on-surface placeholder:text-outline focus:border-muted-gold focus:ring-0 sm:text-sm transition-colors duration-200" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1">
<label class="block font-label-small text-label-small text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="font-label-small text-label-small text-muted-gold hover:text-secondary transition-colors duration-200" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline px-3" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="block w-full border-0 border-b border-outline-variant bg-transparent py-3 pl-10 pr-3 text-on-surface placeholder:text-outline focus:border-muted-gold focus:ring-0 sm:text-sm transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-cosmic-navy text-warm-ivory font-label-caps text-label-caps py-4 rounded-DEFAULT hover:bg-ink-black transition-colors duration-300 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="my-8 flex items-center">
<div class="flex-grow border-t border-linen-grey"></div>
<span class="flex-shrink-0 mx-4 font-label-small text-label-small text-on-surface-variant uppercase tracking-widest">Or</span>
<div class="flex-grow border-t border-linen-grey"></div>
</div>
<!-- Social Login -->
<div>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-caps text-label-caps py-4 rounded-DEFAULT hover:border-cosmic-navy transition-colors duration-300 flex items-center justify-center gap-3" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</div>
<div class="mt-8 text-center">
<p class="font-body-base text-body-base text-on-surface-variant text-sm">

</p>
</div>
</div>
