<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Schedule Consultation - Komal Kalra</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-container": "#1a1f2c",
                      "surface-tint": "#595e6d",
                      "on-background": "#1d1c18",
                      "tertiary-fixed": "#e6e2db",
                      "on-primary-fixed-variant": "#424655",
                      "surface-dim": "#ded9d3",
                      "inverse-surface": "#32302c",
                      "surface-bright": "#fdf9f2",
                      "secondary": "#8e4e0b",
                      "on-primary": "#ffffff",
                      "on-surface-variant": "#45464c",
                      "primary-fixed-dim": "#c2c6d8",
                      "outline": "#76777c",
                      "background": "#fdf9f2",
                      "secondary-container": "#fda861",
                      "surface-container-low": "#f8f3ec",
                      "secondary-fixed": "#ffdcc3",
                      "on-tertiary-fixed-variant": "#484742",
                      "inverse-primary": "#c2c6d8",
                      "primary-fixed": "#dee2f4",
                      "secondary-fixed-dim": "#ffb77e",
                      "error": "#ba1a1a",
                      "error-container": "#ffdad6",
                      "surface-variant": "#e6e2db",
                      "inverse-on-surface": "#f5f0e9",
                      "on-secondary-fixed": "#2f1500",
                      "tertiary-container": "#201f1b",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#070604",
                      "on-tertiary-container": "#898681",
                      "warm-ivory": "#fef9f2",
                      "surface-container-lowest": "#ffffff",
                      "outline-variant": "#c6c6cc",
                      "on-tertiary-fixed": "#1d1c18",
                      "on-surface": "#1d1c18",
                      "on-primary-container": "#828697",
                      "muted-gold": "#a45f1e",
                      "on-secondary": "#ffffff",
                      "surface": "#fdf9f2",
                      "cosmic-navy": "#1a1f2c",
                      "surface-container": "#f2ede6",
                      "linen-grey": "#ece7e1",
                      "on-error-container": "#93000a",
                      "primary": "#030612",
                      "surface-container-high": "#ece8e1",
                      "on-secondary-fixed-variant": "#6e3900",
                      "surface-container-highest": "#e6e2db",
                      "on-secondary-container": "#743c00",
                      "on-error": "#ffffff",
                      "on-primary-fixed": "#161b28",
                      "tertiary-fixed-dim": "#cac6bf",
                      "ink-black": "#17120e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "8px",
                      "gutter": "24px",
                      "section-lg": "120px",
                      "container-max": "1280px",
                      "section-md": "80px"
              },
              "fontFamily": {
                      "headline-h1": ["Playfair Display"],
                      "label-caps": ["Public Sans"],
                      "headline-h1-mobile": ["Playfair Display"],
                      "headline-h2": ["Playfair Display"],
                      "body-base": ["Public Sans"],
                      "body-lg": ["Public Sans"],
                      "label-small": ["Public Sans"],
                      "display-lg-mobile": ["Playfair Display"],
                      "display-lg": ["Playfair Display"]
              },
              "fontSize": {
                      "headline-h1": ["48px", { "lineHeight": "1.2", "fontWeight": "500" }],
                      "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.12em", "fontWeight": "600" }],
                      "headline-h1-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "500" }],
                      "headline-h2": ["36px", { "lineHeight": "1.3", "fontWeight": "500" }],
                      "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                      "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                      "label-small": ["11px", { "lineHeight": "1.2", "fontWeight": "500" }],
                      "display-lg-mobile": ["40px", { "lineHeight": "1.15", "fontWeight": "600" }],
                      "display-lg": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom hide scrollbar */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-warm-ivory text-ink-black antialiased font-body-base min-h-screen flex flex-col selection:bg-muted-gold selection:text-white">
<!-- Mobile Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-warm-ivory/90 backdrop-blur-md border-b border-linen-grey">
<div class="px-6 py-4 flex items-center justify-between">
<button aria-label="Go back" class="text-ink-black p-2 -ml-2">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-[24px] tracking-tight">Schedule</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[72px] pb-[100px] px-6 max-w-[480px] mx-auto w-full">
<!-- Header Section -->
<section class="py-8 text-center border-b border-linen-grey/50">
<span class="font-label-caps text-label-caps text-muted-gold block mb-2">Step 2 of 3</span>
<h2 class="font-headline-h1-mobile text-headline-h1-mobile text-ink-black mb-3">Select a Time</h2>
<p class="font-body-base text-body-base text-on-surface-variant max-w-[280px] mx-auto">
                Choose a date and time for your Astrological Guidance session.
            </p>
</section>
<!-- Booking Summary (Collapsible) -->
<section class="mt-6 mb-8 border border-linen-grey bg-surface-container-low">
<details class="group" open="">
<summary class="flex justify-between items-center p-5 cursor-pointer list-none">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-muted-gold">stars</span>
<span class="font-label-caps text-label-caps text-ink-black tracking-widest">BOOKING SUMMARY</span>
</div>
<span class="material-symbols-outlined text-outline transition-transform duration-300 group-open:rotate-180">expand_more</span>
</summary>
<div class="px-5 pb-5 pt-2 border-t border-linen-grey/50">
<div class="flex justify-between items-start mb-4">
<div>
<h3 class="font-body-lg text-body-lg font-medium text-ink-black">Astrological Guidance</h3>
<p class="font-body-base text-body-base text-on-surface-variant mt-1">60 Minutes • Video Call</p>
</div>
<span class="font-headline-h2 text-[20px] text-ink-black">$350</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-body-base text-[14px]">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span>Pacific Time (PT)</span>
</div>
</div>
</details>
</section>
<!-- Date Picker (Horizontal Scroll Calendar) -->
<section class="mb-10">
<div class="flex justify-between items-center mb-6">
<h3 class="font-headline-h2 text-[24px] text-ink-black">October 2024</h3>
<div class="flex gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded-full border border-linen-grey text-ink-black hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_left</span></button>
<button class="w-8 h-8 flex items-center justify-center rounded-full border border-linen-grey text-ink-black hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_right</span></button>
</div>
</div>
<div class="flex gap-4 overflow-x-auto hide-scrollbar snap-x pb-2 -mx-6 px-6">
<!-- Day Card 1 -->
<div class="snap-start flex-shrink-0 w-[72px] h-[96px] border border-linen-grey bg-surface flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-muted-gold/50 transition-colors">
<span class="font-label-caps text-[11px] text-on-surface-variant">MON</span>
<span class="font-headline-h2 text-[24px] text-ink-black">14</span>
</div>
<!-- Day Card 2 (Active) -->
<div class="snap-start flex-shrink-0 w-[72px] h-[96px] border border-cosmic-navy bg-cosmic-navy flex flex-col items-center justify-center gap-1 cursor-pointer shadow-sm relative">
<span class="font-label-caps text-[11px] text-warm-ivory/80">TUE</span>
<span class="font-headline-h2 text-[24px] text-warm-ivory">15</span>
<div class="absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-muted-gold"></div>
</div>
<!-- Day Card 3 -->
<div class="snap-start flex-shrink-0 w-[72px] h-[96px] border border-linen-grey bg-surface flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-muted-gold/50 transition-colors">
<span class="font-label-caps text-[11px] text-on-surface-variant">WED</span>
<span class="font-headline-h2 text-[24px] text-ink-black">16</span>
</div>
<!-- Day Card 4 -->
<div class="snap-start flex-shrink-0 w-[72px] h-[96px] border border-linen-grey bg-surface flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-muted-gold/50 transition-colors">
<span class="font-label-caps text-[11px] text-on-surface-variant">THU</span>
<span class="font-headline-h2 text-[24px] text-ink-black">17</span>
</div>
<!-- Day Card 5 -->
<div class="snap-start flex-shrink-0 w-[72px] h-[96px] border border-linen-grey bg-surface flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-muted-gold/50 transition-colors opacity-50">
<span class="font-label-caps text-[11px] text-on-surface-variant">FRI</span>
<span class="font-headline-h2 text-[24px] text-ink-black">18</span>
</div>
</div>
</section>
<!-- Time Slots -->
<section>
<h3 class="font-headline-h2 text-[20px] text-ink-black mb-5">Available Times</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Slot 1 -->
<button class="py-4 border border-linen-grey bg-surface text-center hover:border-muted-gold/50 transition-colors active:bg-surface-container-high">
<span class="font-body-base text-body-base text-ink-black block">10:00 AM</span>
</button>
<!-- Slot 2 -->
<button class="py-4 border border-linen-grey bg-surface text-center hover:border-muted-gold/50 transition-colors active:bg-surface-container-high">
<span class="font-body-base text-body-base text-ink-black block">11:30 AM</span>
</button>
<!-- Slot 3 (Selected) -->
<button class="py-4 border border-cosmic-navy bg-cosmic-navy text-center shadow-sm relative overflow-hidden group">
<span class="font-body-base text-body-base text-warm-ivory block relative z-10">1:00 PM</span>
<div class="absolute inset-0 bg-muted-gold/10 opacity-0 group-hover:opacity-100 transition-opacity z-0"></div>
</button>
<!-- Slot 4 -->
<button class="py-4 border border-linen-grey bg-surface text-center hover:border-muted-gold/50 transition-colors active:bg-surface-container-high">
<span class="font-body-base text-body-base text-ink-black block">3:00 PM</span>
</button>
<!-- Slot 5 -->
<button class="py-4 border border-linen-grey bg-surface text-center hover:border-muted-gold/50 transition-colors active:bg-surface-container-high">
<span class="font-body-base text-body-base text-ink-black block">4:30 PM</span>
</button>
</div>
<div class="mt-8 flex justify-center">
<button class="text-on-surface-variant font-label-caps text-label-caps border-b border-on-surface-variant pb-1 hover:text-ink-black hover:border-ink-black transition-colors">
                    SHOW MORE TIMES
                </button>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-warm-ivory/95 backdrop-blur-md border-t border-linen-grey p-4 pb-safe-area shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-50">
<div class="max-w-[480px] mx-auto flex gap-4">
<button class="w-1/3 py-4 border border-cosmic-navy text-cosmic-navy font-label-caps text-label-caps text-center tracking-widest hover:bg-surface-container-high transition-colors">
                BACK
            </button>
<button class="w-2/3 py-4 bg-cosmic-navy text-warm-ivory font-label-caps text-label-caps text-center tracking-widest shadow-sm hover:bg-ink-black transition-colors">
                CONTINUE
            </button>
</div>
</div>
</body></html>
